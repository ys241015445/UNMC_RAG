[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unmc-rag"
version = "0.1.0"
description = "Low-cost on-campus course RAG MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "certifi>=2025",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic-settings>=2.10",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]
scrape = [
  "httpx>=0.28",
  "beautifulsoup4>=4.13",
  "lxml>=5.4",
]
ingest = [
  "pypdf>=5",
  "openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
# Do not force-include paths already inside `app/` — newer hatchling packs
# package data once and then errors on a duplicate wheel path.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
