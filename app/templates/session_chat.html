<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body
  class="chat-app"
  data-entry-path="{{ entry_path }}"
  data-email-domain="{{ school_email_domain }}"
>
  <div class="page chat-shell">
    <header class="hero">
      <p class="brand">{{ app_name }}</p>
      <h1>Campus assistant</h1>
      <p class="lede">
        Ask about student services. This page keeps the conversation so you can follow up.
      </p>
    </header>

    <div id="message-list" class="message-list" role="log" aria-live="polite" aria-relevant="additions">
      {% if opening_message %}
      <article class="bubble bubble-assistant" data-role="assistant">
        <span class="bubble-role">Assistant</span>
        <p>{{ opening_message }}</p>
      </article>
      {% endif %}
    </div>

    <form id="chat-form" class="ask-form composer" autocomplete="on">
      <label>
        School email
        <input
          id="school-email"
          name="school_email"
          type="email"
          required
          placeholder="student@{{ school_email_domain }}"
          value="student@{{ school_email_domain }}"
        />
      </label>
      <p class="composer-note">Your school email is saved with this conversation.</p>
      <label>
        Message
        <textarea
          id="question"
          name="message"
          rows="3"
          required
          maxlength="2000"
          placeholder="Ask a question, then follow up in the same thread"
        ></textarea>
      </label>
      <p id="form-error" class="error" hidden></p>
      <button type="submit" id="submit-btn">Send</button>
    </form>
  </div>
  <script src="/static/session-chat.js" defer></script>
</body>
</html>
