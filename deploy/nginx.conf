error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html;
        index index.html;

        location /static/ {
            alias /var/www/html/static/;
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-School-Email $http_x_school_email;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /setting {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Opaque study pages. FastAPI registers these from conditions.json.
        location ~ ^/(k7q2|m3x9|p8d4|t5w1)/?$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-School-Email $http_x_school_email;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }

        location /ready {
            proxy_pass http://127.0.0.1:8000/ready;
            proxy_set_header Host $host;
            proxy_read_timeout 15s;
        }

        # Home chat is the FastAPI page, same as local uvicorn. Do not serve frontend/index.html.
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-School-Email $http_x_school_email;
            add_header Cache-Control "no-store";
        }
    }
}
