# Coolify + GitHub App (canonical).
# Resource type: Docker Compose · file: docker-compose.yaml · branch: main
# Domain → service `app`, container port 80. Do not set APP_IMAGE.
# Do not use compose.local.yaml on Coolify (that file only publishes localhost:8080).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_URL_APP_80
      - SERVICE_FQDN_APP_80
      - UNMC_RAG_APP_NAME=${UNMC_RAG_APP_NAME:-UNMC Course Assistant}
      - UNMC_RAG_SCHOOL_EMAIL_DOMAIN=${UNMC_RAG_SCHOOL_EMAIL_DOMAIN:-unmc.edu}
      - UNMC_RAG_COURSE_TERMS=${UNMC_RAG_COURSE_TERMS:-calculus,linear algebra,graduation,shuttle,counselling,timetable,appeals,examination,visa,wellbeing,amenities}
      - UNMC_RAG_MINIMUM_RETRIEVAL_SCORE=${UNMC_RAG_MINIMUM_RETRIEVAL_SCORE:-0.3}
      - UNMC_RAG_CORPUS_PATH=${UNMC_RAG_CORPUS_PATH:-data/scraped/current_students/documents.jsonl}
      - UNMC_RAG_CHUNK_SIZE=${UNMC_RAG_CHUNK_SIZE:-500}
      - UNMC_RAG_CHUNK_OVERLAP=${UNMC_RAG_CHUNK_OVERLAP:-80}
      - UNMC_RAG_RETRIEVAL_TOP_K=${UNMC_RAG_RETRIEVAL_TOP_K:-5}
      - LLM_API_BASE=${LLM_API_BASE:-https://open.bigmodel.cn/api/paas/v4/}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4.5-air}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - DATABASE_URL=${DATABASE_URL:-}
    expose:
      - "80"
    restart: unless-stopped
